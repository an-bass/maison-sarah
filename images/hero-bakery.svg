<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="heroTitle">
  <title id="heroTitle">Assorted fresh bread and pastries on a bakery shelf</title>

  <!-- background -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbeee0"/>
      <stop offset="100%" stop-color="#f4dcc4"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fff6e8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fff6e8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <ellipse cx="400" cy="140" rx="420" ry="220" fill="url(#glow)"/>

  <!-- shelf -->
  <rect x="0" y="360" width="800" height="18" fill="#8a5a3b"/>
  <rect x="0" y="378" width="800" height="10" fill="#6f4529"/>
  <rect x="0" y="470" width="800" height="18" fill="#8a5a3b"/>
  <rect x="0" y="488" width="800" height="10" fill="#6f4529"/>

  <!-- baguette -->
  <g transform="translate(60,300)">
    <path d="M0 40 Q30 -10 200 0 Q230 5 220 35 Q120 55 0 40 Z" fill="#d99a53"/>
    <path d="M20 20 Q90 0 190 12" stroke="#b97a37" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M15 30 Q90 10 200 22" stroke="#b97a37" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- round loaf -->
  <g transform="translate(310,290)">
    <ellipse cx="70" cy="60" rx="80" ry="46" fill="#c98a49"/>
    <ellipse cx="70" cy="44" rx="72" ry="40" fill="#e2ab68"/>
    <path d="M30 30 L60 44 M70 26 L70 44 M110 30 L80 44" stroke="#a8703a" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>

  <!-- croissant -->
  <g transform="translate(470,310)">
    <path d="M0 40 C10 0 60 -10 90 10 C110 22 110 45 90 55 C60 72 10 65 0 40 Z" fill="#e3ab5e"/>
    <path d="M10 30 C30 10 60 8 80 20" stroke="#b97a37" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M15 42 C40 30 65 30 82 38" stroke="#b97a37" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- tart / pastry -->
  <g transform="translate(610,300)">
    <ellipse cx="70" cy="70" rx="66" ry="24" fill="#a85c2f"/>
    <path d="M4 70 Q70 20 136 70 Q70 92 4 70 Z" fill="#f1c68a"/>
    <circle cx="40" cy="58" r="8" fill="#c0392b"/>
    <circle cx="70" cy="50" r="8" fill="#c0392b"/>
    <circle cx="100" cy="58" r="8" fill="#c0392b"/>
  </g>

  <!-- second shelf: cake + rolls -->
  <g transform="translate(140,400)">
    <ellipse cx="60" cy="46" rx="58" ry="18" fill="#f7dfe6"/>
    <rect x="2" y="10" width="116" height="38" rx="8" fill="#f2c6d6"/>
    <ellipse cx="60" cy="10" rx="58" ry="14" fill="#fbe4ec"/>
    <circle cx="60" cy="4" r="6" fill="#c0392b"/>
  </g>

  <g transform="translate(360,412)">
    <ellipse cx="24" cy="20" rx="26" ry="16" fill="#dba05a"/>
    <ellipse cx="70" cy="24" rx="26" ry="16" fill="#e2ab68"/>
    <ellipse cx="118" cy="18" rx="26" ry="16" fill="#dba05a"/>
  </g>

  <g transform="translate(560,405)">
    <rect x="0" y="0" width="150" height="36" rx="10" fill="#c98a49"/>
    <rect x="8" y="6" width="134" height="10" rx="5" fill="#e2ab68" opacity="0.6"/>
  </g>
</svg>
